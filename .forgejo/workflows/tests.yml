name: 无 PVF 检查

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  no-pvf:
    runs-on: codeberg-small
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0-noble
    defaults:
      run:
        shell: bash
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: 检出 PR 提交
        env:
          REPOSITORY_URL: ${{ forgejo.event.pull_request.head.repo.clone_url }}
          PR_COMMIT: ${{ forgejo.event.pull_request.head.sha }}
        run: |
          git init .
          git remote add origin "$REPOSITORY_URL"
          git fetch --depth=1 origin "$PR_COMMIT"
          git checkout --detach "$PR_COMMIT"

      # The dotnet SDK image intentionally has no PowerShell and no PVF.  Keep
      # this job shell-only and run the resource-free entry points directly.
      # This also avoids the old build/check path, which was not a runnable
      # DLL path after --artifacts-path was introduced.
      - name: Debug 无资源构建与核心自测
        run: |
          dotnet build ServerS5A9.sln -c Debug --nologo
          dotnet run --project Tools/ArchitectureCheck -c Debug --no-build
          dotnet run --project Tools/PvfLib.Tests -c Debug --no-build
          dotnet run --project Server/DfoServer -c Debug --no-build -- --selftest-core
          dotnet run --project Server/DfoServer -c Debug --no-build -- --selftest-tcp commands

      - name: Release 无资源构建与核心自测
        run: |
          dotnet build ServerS5A9.sln -c Release --nologo
          dotnet run --project Tools/ArchitectureCheck -c Release --no-build
          dotnet run --project Tools/PvfLib.Tests -c Release --no-build
          dotnet run --project Server/DfoServer -c Release --no-build -- --selftest-core
          dotnet run --project Server/DfoServer -c Release --no-build -- --selftest-tcp commands
